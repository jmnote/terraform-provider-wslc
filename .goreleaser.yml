# GoReleaser configuration for the jmnote/wslc Terraform provider.
#
# Restricted to windows/amd64 and windows/arm64: this provider only runs as
# part of Terraform executing natively on Windows, driving wslc.exe (the
# WSL container CLI), so no other OS/arch combination is meaningful to
# publish.
#
# Requires GPG_PRIVATE_KEY and (optionally) GPG_PASSPHRASE to be set as
# GitHub Actions secrets to sign SHA256SUMS -- see RELEASING.md.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}}"
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      # --pinentry-mode loopback lets a passphrase-protected key sign
      # non-interactively in CI; GPG_PASSPHRASE may be empty for a
      # passphrase-less key, which gpg also accepts here.
      - "--batch"
      - "--pinentry-mode"
      - "loopback"
      - "--passphrase"
      - "{{ .Env.GPG_PASSPHRASE }}"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

changelog:
  disable: true
